<!doctype html><meta charset="utf-8"><title>The Prompt Book</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#121014;font-family:Georgia,serif;color:#f4f1ea;position:relative}
.valance{position:absolute;inset:0 0 auto 0;height:230px;background:#6b1020;border-bottom:14px solid #f5a81c;padding:48px 72px}
.valance h1{font-size:76px;line-height:.98;letter-spacing:-.02em;max-width:980px}
.plaque{position:absolute;right:72px;top:56px;background:#f5a81c;color:#121014;font:700 24px/1 Helvetica,Arial,sans-serif;padding:20px 28px;border-radius:4px}
.curtL,.curtR{position:absolute;top:230px;bottom:0;width:190px;background:repeating-linear-gradient(90deg,#6b1020 0 26px,#560b18 26px 52px)}
.curtL{left:0}.curtR{right:330px}
.stage{position:absolute;left:190px;right:520px;top:244px;bottom:70px;background:#1b181f}
.screen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;height:300px;background:#f4f1ea;border-radius:10px;padding:28px}
.screen i{display:block;height:22px;background:#2a4bd0;border-radius:4px;margin-bottom:18px;width:55%}
.screen b{display:block;height:14px;background:#cfc9bb;border-radius:3px;margin-bottom:12px}
.screen u{display:block;height:54px;width:180px;background:#f5a81c;border-radius:6px;margin-top:26px}
.rope{position:absolute;top:244px;width:3px;height:150px;background:#c9a66b}
.floor{position:absolute;left:190px;right:520px;bottom:0;height:70px;background:#2a2228}
.tape{position:absolute;bottom:26px;height:8px;width:70px;background:#f5a81c}
.cues{position:absolute;right:0;top:230px;bottom:0;width:330px;background:#1d1a22;border-left:2px solid #3a3440;padding:34px 30px}
.cues h2{font:700 24px/1 Helvetica,Arial,sans-serif;letter-spacing:.06em;margin-bottom:26px}
.cue{display:grid;grid-template-columns:44px 1fr 18px;gap:14px;align-items:center;padding:17px 0;border-top:1px solid #3a3440;font:15px Helvetica,Arial,sans-serif;color:#8d8794}
.cue em{width:18px;height:18px;border-radius:50%;background:#3a3440}
.cue.on{color:#f4f1ea}.cue.on em{background:#f5a81c;box-shadow:0 0 0 5px #f5a81c33}
</style>
<div class="valance"><h1>Products are complex.<br>Watch what one takes.</h1></div>
<div class="plaque">Talk to Kevin</div>
<div class="curtL"></div><div class="curtR"></div>
<div class="stage"><div class="screen"><i></i><b></b><b style="width:80%"></b><b style="width:64%"></b><u></u></div></div>
<div class="rope" style="left:420px"></div><div class="rope" style="left:700px"></div>
<div class="floor"></div><div class="tape" style="left:360px"></div><div class="tape" style="left:760px"></div>
<div class="cues"><h2>CUE STACK</h2>
<div class="cue on"><span>Q1</span><span>Wireframe on stage</span><em></em></div>
<div class="cue"><span>Q2</span><span>Frontend renders</span><em></em></div>
<div class="cue"><span>Q3</span><span>Server answers</span><em></em></div>
<div class="cue"><span>Q4</span><span>Token verified</span><em></em></div>
<div class="cue"><span>Q5</span><span>Cloud scales out</span><em></em></div>
<div class="cue"><span>Q6</span><span>Model returns</span><em></em></div></div>
